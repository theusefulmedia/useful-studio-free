:root {
  --ui-bg: #15161b;
  --ui-panel: #1d1f26;
  --ui-line: #2e313b;
  --ui-text: #eceef4;
  --ui-soft: #a3a8b8;
  --ui-accent: #9db1ff;
  --ui-accent-ink: #10131f;
  --film-bg: #15161b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ui-bg);
  color: var(--ui-text);
  font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
#app { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: 100vh; }
#panel {
  background: var(--ui-panel);
  border-right: 1px solid var(--ui-line);
  overflow-y: auto;
  padding: 24px 22px 40px;
}
#panel header { margin-bottom: 8px; }
.kicker { color: var(--ui-accent); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
h1 { font-size: 26px; line-height: 1.15; margin: 6px 0 6px; font-weight: 750; letter-spacing: -0.01em; }
#panel header p { margin: 0; color: var(--ui-soft); }
section { border-top: 1px solid var(--ui-line); padding: 18px 0 6px; margin-top: 18px; }
h2 { font-size: 13px; font-weight: 700; margin: 0 0 12px; color: var(--ui-soft); letter-spacing: 0.06em; text-transform: uppercase; }
.field { display: block; margin: 0 0 14px; }
.lab { display: block; font-weight: 600; margin-bottom: 6px; }
.hint { display: block; color: var(--ui-soft); font-size: 13px; margin-top: 5px; }
input[type=text], textarea, select {
  width: 100%;
  background: #14151a;
  color: var(--ui-text);
  border: 1px solid var(--ui-line);
  border-radius: 9px;
  padding: 10px 11px;
  font: inherit;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, textarea:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair { display: flex; gap: 8px; align-items: center; }
input[type=color] { width: 44px; height: 40px; padding: 2px; border: 1px solid var(--ui-line); border-radius: 9px; background: #14151a; flex: none; cursor: pointer; }
.hex { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px; }
.sizes { display: grid; gap: 8px; }
button, .download {
  font: inherit;
  font-weight: 600;
  color: var(--ui-text);
  background: #2a2d37;
  border: 1px solid #3a3e4a;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  text-align: left;
  text-decoration: none;
  display: inline-block;
}
button:hover { background: #333744; }
button[aria-checked=true] { border-color: var(--ui-accent); background: #262d45; }
button.primary { background: var(--ui-accent); color: var(--ui-accent-ink); border-color: var(--ui-accent); }
button.primary:hover { background: #b4c3ff; }
button.quiet { background: transparent; }
button:disabled { opacity: 0.55; cursor: default; }
.download { background: #1f3b2c; border-color: #3f7a59; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px; }
progress { width: 100%; height: 10px; accent-color: var(--ui-accent); }
[hidden] { display: none !important; }
footer { border-top: 1px solid var(--ui-line); margin-top: 22px; padding-top: 16px; color: var(--ui-soft); font-size: 13px; }
footer p { margin: 0 0 6px; }
footer a { color: var(--ui-accent); font-weight: 600; }
#stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
#frame { display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 0; overflow: hidden; }
#film { display: block; border-radius: 6px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); cursor: pointer; }
#transport { display: flex; align-items: center; gap: 12px; padding: 12px 28px 22px; }
#transport input[type=range] { flex: 1; accent-color: var(--ui-accent); }
#time { color: var(--ui-soft); font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; }
#cleanhint {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
  background: rgba(15, 16, 20, 0.85); color: #fff; padding: 8px 14px; border-radius: 99px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
#cleanhint.show { opacity: 1; }
body.clean { background: var(--film-bg); overflow: hidden; }
body.clean #panel, body.clean #transport { display: none; }
body.clean #app { display: block; }
body.clean #stage, body.clean #frame { position: fixed; inset: 0; padding: 0; display: flex; }
body.clean #film { border-radius: 0; box-shadow: none; cursor: default; }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  #stage { order: -1; height: 70vh; }
  #panel { border-right: 0; }
}
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--ui-accent); }

  // Land when the spring is within half a pixel of rest; from there it is exactly at rest.
  var travel = { rise: 1.45, cascade: 0.75, words: 0.8, wipe: 0.25, fade: 0.3, scale: 0.3, flicker: 0.3, type: 0.3 }[enter] || 1.45;
  b.eps = clamp(0.5 / Math.max(1, b.size * travel), 0.0012, 0.004);
  // The odometer rolls 10 digits, so its tolerance is a tenth as wide.
  if (b.enter === "odometer") b.eps = 0.5 / (10 * Math.round(b.size * 1.05));
  b.enterDur = enterDuration(b);
  b.land = b.at + b.enterDur;
  return b;
}

var LAND_EPS = 0.0015;

function enterStagger(b) {
  if (b.enter === "cascade") return Math.min(0.03, 0.45 / Math.max(1, b.chars));
  if (b.enter === "words") return Math.min(0.08, 0.8 / Math.max(1, b.words));
  if (b.enter === "type") return Math.min(0.045, 1.1 / Math.max(1, b.chars));
  if (b.enter === "odometer") return 0.08;
  return 0.09;
}

function enterDuration(b) {
  var st = enterStagger(b);
  var lt = landTime(b.spring, b.eps);
  if (b.enter === "cascade") return (b.chars - 1) * st + lt;
  if (b.enter === "words") return (b.words - 1) * st + lt;
  if (b.enter === "type") return b.chars * st + 0.05;
  if (b.enter === "flicker") return 0.42;
  if (b.enter === "scale") return lt;
  if (b.enter === "odometer") return (b.chars - 1) * st + lt;
  return (b.lines.length - 1) * st + lt;
}

// Visible characters per frame in a typewriter entrance.
function typedCount(b, lt) {
  var st = enterStagger(b);
  return clamp(Math.floor((lt - b.at) / st) + 1, 0, b.chars);
}

function setFont(ctx, b) {
  ctx.font = b.font;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function fillLine(ctx, b, line, x, y, from, to) {
  if (!b.perChar && from == null) {
    ctx.fillText(line.s, x, y);
    return;
  }
  var a = from || 0, z = to == null ? line.glyphs.length : to;
  for (var i = a; i < z; i++) {
    var gl = line.glyphs[i];
    if (gl.ch !== " ") ctx.fillText(gl.ch, x + gl.dx, y);
  }
}

function paintBlock(ctx, g, b, x0, y0, ink) {
  // Draws every line at an offset (x0, y0) from its rest position.
  ctx.fillStyle = ink;
  for (var i = 0; i < b.lines.length; i++) {
    var l = b.lines[i];
    fillLine(ctx, b, l, l.x + x0, l.y + y0);
  }
}

function paintStill(ctx, g, b, alpha) {
  ctx.globalAlpha = alpha;
  if (b.shadow) {
    var off = Math.max(2, Math.round(b.size * 0.05));
    paintBlock(ctx, g, b, off, off, css(g.shadowInk(b.on)));
  }
  if (b.glow) {
    ctx.shadowColor = css(g.glowInk(), 0.85);
    ctx.shadowBlur = Math.round(b.size * 0.28);
    paintBlock(ctx, g, b, 0, 0, css(b.fg));
    ctx.shadowBlur = Math.round(b.size * 0.08);
  }
  paintBlock(ctx, g, b, 0, 0, css(b.fg));
  ctx.shadowBlur = 0;
  ctx.shadowColor = "rgba(0,0,0,0)";
  ctx.globalAlpha = 1;
}

/*
 * Draw a block at scene time s.t. Phases: before `at` nothing, then the
 * entrance, the still hold from b.land to s.out, then the exit.
 */
function drawBlock(g, b, s) {
  var ctx = g.ctx;
  var lt = s.t;
  if (lt < b.at) return;
  var out = b.noExit ? Infinity : s.out;
  var phase = lt < b.land ? "in" : lt < out ? "hold" : "out";
  var e = phase === "out" ? exitCurve(lt - out) : 0;
  if (e >= 0.999) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  setFont(ctx, b);
  var fg = css(b.fg);
  var sig = null;
  if (phase === "hold" && !b.noExit) {
    paintStill(ctx, g, b, 1);
    sig = b.font + "|" + b.lines.map(function (l) { return l.x + "," + l.y + "," + l.s; }).join("|") + "|" + fg;
    if (b.cursor) drawCursor(g, b, lt, true);
  } else if (phase === "hold") {
    paintStill(ctx, g, b, 1);
    sig = b.font + "|" + b.lines.map(function (l) { return l.x + "," + l.y + "," + l.s; }).join("|") + "|" + fg;
  } else if (phase === "out") {
    var pad = Math.ceil(b.size * 0.3);
    ctx.beginPath();
    ctx.rect(b.box.x - pad, b.box.y - pad, b.box.w + pad * 2, b.box.h + pad * 2);
    ctx.clip();
    var dy = -e * b.size * 0.45;
    ctx.translate(0, dy);
    paintStill(ctx, g, b, 1 - e);
  } else {
    drawEntrance(g, b, lt, fg);
  }
  ctx.restore();
  var dyLog = phase === "out" ? -e * b.size * 0.45 : 0;
  g.log.push({
    id: g.sceneIndex + ":" + b.id,
    text: b.text,
    words: b.words,
    phase: phase,
    x: b.box.x,
    y: Math.round(b.box.y + dyLog),
    w: b.box.w,
    h: b.box.h,
    size: b.size,
    big: b.big,
    ratio: b.ratio,
    fg: rgbHex(b.fg),
    on: rgbHex(b.on),
    sig: sig
  });
}

function drawEntrance(g, b, lt, fg) {
  var ctx = g.ctx;
  var st = enterStagger(b);
  var pad = Math.ceil(b.size * 0.22);
  var k = b.enter;
  if (k === "type") {
    var n = typedCount(b, lt);
    ctx.fillStyle = fg;
    var left = n;
    for (var i = 0; i < b.lines.length && left > 0; i++) {
      var l = b.lines[i];
      var take = Math.min(left, l.glyphs.length);
      fillLine(ctx, b, l, l.x, l.y, 0, take);
      left -= take;
    }
    drawCursor(g, b, lt, false, n);
    return;
  }
  if (k === "odometer") {
    drawOdometer(g, b, lt, fg);
    return;
  }
  if (k === "flicker") {
    var p = (lt - b.at) / b.enterDur;
    var on = [1, 0, 1, 1, 0, 0, 1, 0, 1, 1, 1, 1][clamp(Math.floor(p * 12), 0, 11)];
    paintStill(ctx, g, b, on ? (p < 0.6 ? 0.55 : 1) : 0.12);
    return;
  }
  if (k === "scale") {
    var ps = springLand(lt - b.at, b.spring, b.eps);
    var cx = b.box.x + b.box.w / 2, cy = b.box.y + b.box.h / 2;
    ctx.translate(cx, cy);
    var sc = 0.55 + 0.45 * ps;
    ctx.scale(sc, sc);
    ctx.translate(-cx, -cy);
    ctx.globalAlpha = clamp(ps * 2.5, 0, 1);
    paintBlock(ctx, g, b, 0, 0, fg);
    ctx.globalAlpha = 1;
    return;
  }
  if (k === "fade") {
    var pf = springLand(lt - b.at, b.spring, b.eps);
    ctx.globalAlpha = clamp(pf, 0, 1);
    paintBlock(ctx, g, b, 0, (1 - pf) * b.size * 0.3, fg);
    ctx.globalAlpha = 1;
    return;
  }
  var ci = 0, wi = 0;
  for (var li = 0; li < b.lines.length; li++) {
    var line = b.lines[li];
    var asc = Math.ceil(b.m.asc), desc = Math.ceil(b.m.desc);
    ctx.save();
    ctx.beginPath();
    ctx.rect(line.x - pad, line.y - asc - pad, line.w + pad * 2, asc + desc + pad * 2);
    ctx.clip();
    ctx.fillStyle = fg;
    if (k === "wipe") {
      var pw = springLand(lt - b.at - li * st, b.spring, b.eps);
      ctx.beginPath();
      var ww = (line.w + pad * 2) * clamp(pw, 0, 1.2);
      ctx.rect(line.x - pad, line.y - asc - pad, ww, asc + desc + pad * 2);
      ctx.clip();
      fillLine(ctx, b, line, line.x + (1 - pw) * -b.size * 0.25, line.y);
      // A bar rides the wiping edge, then leaves with it.
      if (pw < 1) {
        ctx.fillStyle = css(g.edgeInk(b.on));
        ctx.fillRect(line.x - pad + ww - Math.ceil(b.size * 0.08), line.y - asc - pad, Math.ceil(b.size * 0.08), asc + desc + pad * 2);
      }
    } else if (k === "cascade") {
      for (var j = 0; j < line.glyphs.length; j++) {
        var pc = springLand(lt - b.at - ci * st, b.spring, b.eps);
        ci++;
        if (pc <= 0) continue;
        var gl = line.glyphs[j];
        ctx.globalAlpha = clamp(pc * 2, 0, 1);
        ctx.fillText(gl.ch, line.x + gl.dx, line.y + (1 - pc) * b.size * 0.75);
      }
      ctx.globalAlpha = 1;
    } else if (k === "words") {
      var parts = line.s.split(" ");
      var gi = 0;
      for (var q = 0; q < parts.length; q++) {
        var pwd = springLand(lt - b.at - wi * st, b.spring, b.eps);
        wi++;
        if (pwd > 0) {
          ctx.globalAlpha = clamp(pwd * 2, 0, 1);
          fillLine(ctx, b, line, line.x, line.y + (1 - pwd) * b.size * 0.8, gi, gi + Array.from(parts[q]).length);
        }
        gi += Array.from(parts[q]).length + 1;
      }
      ctx.globalAlpha = 1;
    } else {
      // Masked rise, line by line.
      var pr = springLand(lt - b.at - li * st, b.spring, b.eps);
      fillLine(ctx, b, line, line.x, line.y + (1 - pr) * (asc + desc + pad * 1.5));
    }
    ctx.restore();
  }
}

function drawCursor(g, b, lt, holding, n) {
  var ctx = g.ctx;
  var last = b.lines[b.lines.length - 1];
  var x, y = last.y, line = last;
  if (!holding) {
    var left = n;
    for (var i = 0; i < b.lines.length; i++) {
      line = b.lines[i];
      if (left <= line.glyphs.length) break;
      left -= line.glyphs.length;
    }
    y = line.y;
    x = left >= line.glyphs.length ? line.x + line.w : line.x + line.glyphs[left].dx;
  } else {
    // Blink: a pure function of time.
    if (Math.floor((lt - b.land) / 0.5) % 2 === 1) return;
    x = last.x + last.w;
  }
  var cw = Math.max(4, Math.round(b.size * 0.5));
  ctx.fillStyle = css(g.edgeInk(b.on));
  ctx.fillRect(Math.round(x + b.size * 0.08), Math.round(y - b.m.cap), cw, Math.round(b.m.cap));
}

/*
 * Odometer: each digit column rolls into place, left to right.
 * Other characters fade in where they rest.
 */
function drawOdometer(g, b, lt, fg) {
  var ctx = g.ctx;
  var st = enterStagger(b);
  var col = 0;
  var cellH = Math.round(b.size * 1.05);
  ctx.fillStyle = fg;
  for (var li = 0; li < b.lines.length; li++) {
    var line = b.lines[li];
    var cap = Math.ceil(b.m.cap), pad = Math.ceil(b.size * 0.1);
    ctx.save();
    ctx.beginPath();
    ctx.rect(line.x - b.size, line.y - cap - pad, line.w + b.size * 2, cap + pad * 2);
    ctx.clip();
    for (var j = 0; j < line.glyphs.length; j++) {
      var gl = line.glyphs[j];
      var p = springLand(lt - b.at - col * st, b.spring, b.eps);
      col++;
      var d = gl.ch.charCodeAt(0) - 48;
      if (d >= 0 && d <= 9) {
        var spins = 1;
        var dir = b.down ? -1 : 1;
        var pos = d - dir * spins * 10 * (1 - p);
        var base = Math.floor(pos), frac = pos - base;
        var cw = textWidth(b.font, gl.ch, 0);
        var cx = line.x + gl.dx + cw / 2;
        for (var k = 0; k < 2; k++) {
          var dd = (((base + k) % 10) + 10) % 10;
          var ch = String(dd);
          var y = line.y + (k - frac) * cellH;
          ctx.fillText(ch, cx - textWidth(b.font, ch, 0) / 2, y);
        }
      } else if (gl.ch !== " ") {
        ctx.globalAlpha = clamp(p * 1.6, 0, 1);
        ctx.fillText(gl.ch, line.x + gl.dx, line.y + (1 - clamp(p, 0, 1)) * b.size * 0.3);
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }
}

/*
 * The 12 Useful Studio looks. A look sets the font pairing, the motion feel,
 * the background treatment, a texture, card style and the cut between scenes.
 * It always uses the buyer's 4 colours.
 *
 * tones(pal) gives the 3 scene backgrounds: base, alt and pop.
 */
var LOOKS = {};

function defLook(o) {
  LOOKS[o.id] = o;
}

defLook({
  id: "pop",
  display: { font: "bricolage-grotesque", weight: 800, upper: false, track: -0.02, lh: 0.98 },
  body: { font: "inter", weight: 600 },
  label: { weight: 800, track: 0.04 },
  spring: { response: 0.45, damping: 0.6 },
  enter: { display: "cascade", title: "words", body: "words", label: "scale", number: "odometer" },
  align: "left", grain: 0.025, transition: "circle", textShadow: true,
  card: { radius: 2.2, style: "hard" },
  tones: function (p) {
    return { base: p.main, alt: p.accent, pop: cmix(p.lightBg, p.accent, 0.12) };
  },
  deco: function (g) {
    // Halftone dots in 2 corners, sized by distance, drifting slowly.
    var c = g.ctx;
    var sp = Math.round(g.u * 2.6);
    var col = g.shapeInk(g.bg, [shade(g.bg, -0.18), shade(g.bg, 0.25)], 1.25);
    c.fillStyle = css(col, 0.9);
    var drift = wave(g.t, g.D, 0) * sp * 0.5;
    var spots = [[g.W * 1.02, -g.H * 0.05], [-g.W * 0.03, g.H * 1.04]];
    var R = Math.max(g.W, g.H) * 0.42;
    for (var k = 0; k < spots.length; k++) {
      var cx = spots[k][0], cy = spots[k][1];
      var x0 = Math.max(0, Math.floor((cx - R) / sp)), x1 = Math.min(Math.ceil(g.W / sp), Math.ceil((cx + R) / sp));
      var y0 = Math.max(0, Math.floor((cy - R) / sp)), y1 = Math.min(Math.ceil(g.H / sp), Math.ceil((cy + R) / sp));
      for (var gy = y0; gy <= y1; gy++) {
        for (var gx = x0; gx <= x1; gx++) {
          var x = gx * sp + (gy % 2 ? sp / 2 : 0) + drift, y = gy * sp;
          var d = Math.hypot(x - cx, y - cy) / R;
          if (d >= 1) continue;
          var r = sp * 0.42 * (1 - d);
          if (r < 0.8) continue;
          c.beginPath();
          c.arc(x, y, r, 0, TAU);
          c.fill();
        }
      }
    }
  }
});

var pathCache = {};
function iconPath(name) {
  if (!pathCache[name]) pathCache[name] = new Path2D(ICONS[name] || ICONS.star);
  return pathCache[name];
}

/*
 * Draw an icon centred on (cx, cy), `size` px tall, with a draw-on progress p.
 * The stroke stays 2 grid units so every icon shares 1 weight.
 */
function drawIcon(g, name, cx, cy, size, col, p, fill) {
  if (p <= 0) return;
  var c = g.ctx;
  var k = size / 24;
  c.save();
  c.translate(cx - size / 2, cy - size / 2);
  c.scale(k, k);
  c.lineWidth = 2;
  c.lineCap = "round";
  c.lineJoin = "round";
  c.strokeStyle = css(col);
  if (p < 1) {
    c.setLineDash([120, 120]);
    c.lineDashOffset = 120 * (1 - clamp(p, 0, 1));
  }
  if (fill && p >= 1) {
    c.fillStyle = css(fill);
    c.fill(iconPath(name));
  }
  c.stroke(iconPath(name));
  c.restore();
}

function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + r, y, r);
  c.closePath();
}

/*
 * The colour of a card's face in this look, on the current background.
 * Text on the card is picked against this colour.
 */
function cardFace(g, kind) {
  var st = g.look.card.style, bg = g.bg, p = g.pal;
  var light = isLight(bg);
  if (kind === "accent") {
    var a = st === "flat" || st === "hard" || st === "badge" ? (contrast(p.accent, bg) > 1.3 ? p.accent : p.main) : null;
    if (a) return a;
  }
  if (kind === "main") {
    if (contrast(p.main, bg) > 1.25) return p.main;
    return light ? p.dark : p.light;
  }
  switch (st) {
    case "rule": return light ? cmix(bg, WHITE, 0.45) : cmix(bg, p.light, 0.1);
    case "flat": return light ? (contrast(p.main, bg) > 1.4 ? p.main : p.dark) : p.lightBg;
    case "hard": return cmix(p.lightBg, WHITE, 0.3);
    case "outline": return bg;
    case "glass": return cmix(bg, p.light, 0.07);
    case "soft": return cmix(p.lightBg, WHITE, 0.55);
    case "paper": return cmix(p.lightBg, WHITE, 0.4);
    case "tech": return cmix(bg, p.main, 0.14);
    case "badge": return cmix(p.lightBg, WHITE, 0.25);
    case "line": return bg;
    case "neon": return cmix(bg, p.main, 0.08);
    case "calm": return light ? cmix(bg, WHITE, 0.62) : cmix(bg, p.light, 0.12);
  }
  return light ? cmix(bg, WHITE, 0.5) : cmix(bg, p.light, 0.1);
}

/*
 * A card in the look's style. p: entrance progress (spring, may overshoot),

    c.stroke();

    c.lineWidth = Math.max(2, Math.round(u * 0.3));
    c.strokeStyle = css(g.shapeInk(g.bg, [g.pal.light, g.pal.dark], 4));
    c.stroke();
  } else if (st === "line") {
    c.lineWidth = Math.max(1, Math.round(u * 0.14));
    c.strokeStyle = css(g.shapeInk(g.bg, [g.pal.accent, g.pal.light], 2.5), 0.85);

    c.stroke();

    c.strokeStyle = css(cmix(g.pal.main, g.pal.light, 0.25), 0.9);

    var k = Math.round(u * 1.4), tt = Math.max(2, Math.round(u * 0.3));
    c.fillRect(x - tt, y - tt, k, tt); c.fillRect(x - tt, y - tt, tt, k);

}

// A row of stars, popping in one by one.
function drawStars(g, x, cy, size, gap, n, col, t0, t) {
  for (var i = 0; i < n; i++) {
    var p = springLand(t - t0 - i * 0.08, { response: 0.45, damping: 0.55 }, 0.002);
    if (p <= 0) continue;
    var c = g.ctx;
    var cx = x + size / 2 + i * (size + gap);
    c.save();
    c.translate(cx, cy);
    c.scale(p, p);
    c.rotate((1 - p) * 0.8);
    c.fillStyle = css(col);
    c.fill(new Path2D(starPath(0, 0, size / 2, size / 4.6)));
    c.restore();
  }

// Progress ring with ticks. frac 0..1 of a full turn.
function drawRing(g, cx, cy, r, frac, o) {
  var c = g.ctx, u = g.u;

  c.arc(cx, cy, r, 0, TAU);
  c.stroke();
  var ticks = 60;
  c.fillStyle = css(cmix(g.bg, g.isLightBg ? g.pal.dark : g.pal.light, 0.3));

    var a = (i / ticks) * TAU - Math.PI / 2;

    var r0 = r + w / 2 + u * 1.2;

    c.translate(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    c.rotate(a);
    c.fillRect(0, -Math.max(1, u * 0.1), len, Math.max(2, u * 0.2));
    c.restore();

    var col = o.color || g.shapeInk(g.bg, [g.pal.main, g.pal.accent, g.pal.dark], 2);
    c.lineCap = "round";

      c.lineWidth = w * 2.4;
      c.beginPath();
      c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      c.stroke();
    }
    c.strokeStyle = css(col);
    c.lineWidth = w;
    c.beginPath();

// Big quote marks, drawn as shapes so they are not text.
function drawQuoteMarks(g, x, y, size, col, p) {
  if (p <= 0) return;
  var c = g.ctx;
  c.save();
  c.translate(x, y + (1 - p) * size * 0.3);
  c.globalAlpha = clamp(p * 2, 0, 1);
  c.fillStyle = css(col);
  var s = size / 10;
  for (var i = 0; i < 2; i++) {
    var ox = i * s * 5.2;
    c.beginPath();
    c.arc(ox + s * 2.2, s * 5.6, s * 2.2, 0, TAU);
    c.fill();
    c.beginPath();
    c.moveTo(ox + s * 0.02, s * 5.6);
    c.quadraticCurveTo(ox + s * 0.1, s * 1.2, ox + s * 4.0, s * 0.2);
    c.lineTo(ox + s * 4.2, s * 1.3);
    c.quadraticCurveTo(ox + s * 2.0, s * 2.4, ox + s * 1.9, s * 5.2);
    c.closePath();
    c.fill();

  c.restore();

// A starburst badge.
function burstPath(c, cx, cy, r, n, depth, rot) {
  c.beginPath();
  for (var i = 0; i < n * 2; i++) {
    var a = rot + (i / (n * 2)) * TAU;
    var rr = i % 2 ? r * (1 - depth) : r;
    var x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  }
  c.closePath();
}

/*
 * Confetti as a pure function of time: each piece flies on a closed-form
 * path with drag and gravity, spins and flutters.
 */
function drawConfetti(g, ox, oy, t, n, seed, spread, avoid) {
  if (t <= 0) return;
  var c = g.ctx, u = g.u;
  var r = rng(seed);
  var cols = [g.pal.main, g.pal.accent, cmix(g.pal.light, g.pal.accent, 0.3), cmix(g.pal.main, g.pal.light, 0.4)];
  var k = 1.6, grav = u * 26;
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + (r() - 0.5) * (spread || 2.4);
    var sp = u * (40 + r() * 70);
    var vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp;
    var delay = r() * 0.12;
    var tt = t - delay;
    var col = cols[Math.floor(r() * cols.length)];
    var kind = r();
    var size = u * (1.3 + r() * 1.4);
    var spin = (r() - 0.5) * 12, flut = 4 + r() * 6, rot0 = r() * TAU;
    if (tt <= 0) continue;
    var ek = (1 - Math.exp(-k * tt)) / k;
    var x = ox + vx * ek;
    var y = oy + vy * ek + (grav / k) * (tt - ek);
    if (y > g.H + u * 4) continue;
    // Pieces pass behind the words: none is drawn over a text box.
    var hidden = false;
    for (var a = 0; avoid && a < avoid.length; a++) {
      var R = avoid[a];
      if (x > R.x - size && x < R.x + R.w + size && y > R.y - size && y < R.y + R.h + size) { hidden = true; break; }
    }
    if (hidden) continue;
    c.save();
    c.translate(x, y);
    c.rotate(rot0 + spin * tt);
    c.scale(1, Math.cos(flut * tt + rot0));
    c.fillStyle = css(col);
    if (kind < 0.45) c.fillRect(-size * 0.5, -size * 0.25, size, size * 0.5);
    else if (kind < 0.8) { c.beginPath(); c.arc(0, 0, size * 0.38, 0, TAU); c.fill(); }
    else {
      c.strokeStyle = css(col);
      c.lineWidth = size * 0.28;
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(-size * 0.7, 0);
      c.quadraticCurveTo(-size * 0.35, -size * 0.5, 0, 0);
      c.quadraticCurveTo(size * 0.35, size * 0.5, size * 0.7, 0);
      c.stroke();
    }
    c.restore();
  }
}

// A mouse pointer that walks in and taps. Returns the tap ripple progress.
function drawPointer(g, x, y, size, press) {
  var c = g.ctx;
  c.save();
  c.translate(x, y);
  var s = size / 24 * (1 - 0.12 * press);
  c.scale(s, s);
  c.translate(-5.5, -3.5);
  var path = iconPath("cursor");
  c.lineJoin = "round";
  c.lineWidth = 2.4;
  c.fillStyle = css(g.pal.light);
  c.strokeStyle = css(cmix(g.pal.dark, BLACK, 0.3));

  c.stroke(path);
  c.restore();

 * A large, soft version of the brand mark used as a supergraphic. Not text.
 */
function drawSuper(g, cx, cy, size, p, e, spin, mode) {
  if (p <= 0 || e >= 1) return;
  var c = g.ctx, u = g.u;
  var st = g.look.card.style;
  var solid = st === "flat" || st === "hard" || st === "badge";
  var A = g.shapeInk(g.bg, [g.pal.main, g.pal.accent, g.pal.light], 1.3);
  var B = g.shapeInk(A, [g.pal.accent, g.pal.light, g.pal.main], 1.3);
  var tA = solid ? A : cmix(g.bg, A, 0.28);
  var tB = solid ? B : cmix(g.bg, B, 0.36);
  var r = size / 2;
  c.save();
  c.globalAlpha = clamp(p * 1.5, 0, 1) * (1 - e);
  c.translate(cx, cy);
  var k = 0.6 + 0.4 * p;
  c.scale(k, k);
  if (mode === "rings" || st === "line" || st === "neon" || st === "glass") {
    // Concentric rings.
    c.rotate(spin);
    c.strokeStyle = css(st === "neon" ? g.pal.main : mode === "rings" ? cmix(g.bg, A, 0.45) : tB, st === "neon" ? 0.5 : 1);
    c.lineWidth = Math.max(1, u * (mode === "rings" ? 0.5 : 0.18));
    for (var i = 0; i < 4; i++) { c.beginPath(); c.arc(0, 0, r * (1 - i * 0.2), 0, TAU); c.stroke(); }
  } else if (st === "outline" || st === "tech") {
    // Nested squares with a crosshair, drawn as thin lines.
    c.strokeStyle = css(cmix(g.bg, g.shapeInk(g.bg, [g.pal.main, g.pal.light], 1.5), 0.6));
    c.lineWidth = Math.max(1, u * 0.2);
    for (var j = 0; j < 4; j++) { var q = r * (1 - j * 0.22); c.strokeRect(-q, -q, q * 2, q * 2); }
    c.beginPath(); c.moveTo(-r * 1.2, 0); c.lineTo(r * 1.2, 0); c.moveTo(0, -r * 1.2); c.lineTo(0, r * 1.2); c.stroke();

    c.fillRect(-u * 1.2, -u * 1.2, u * 2.4, u * 2.4);

    c.fillStyle = css(tA);
    c.fillRect(-r, -r, size, size);
    c.fillStyle = css(tB);
    c.fillRect(-r, r * 0.25, r * 0.75, r * 0.75);
  } else {
    c.rotate(spin + (1 - p) * 0.5);
    c.fillStyle = css(tA);
    c.beginPath(); c.arc(-r * 0.22, 0, r * 0.78, 0, TAU); c.fill();
    c.fillStyle = css(tB);
    c.beginPath(); c.arc(r * 0.38, 0, r * 0.5, 0, TAU); c.fill();
  }
  c.restore();
}

/*
 * The closing scene most templates share: brand mark, brand name, 1 line,
 * and a big soft version of the mark filling the rest of the frame.
 * opts: { line: field key, tone }
 */
function outroScene(opts) {
  return {
    tone: opts.tone || "pop",
    min: 2.4,
    layout: function (g, f) {
      var s = g.safe, u = g.u;
      var land = g.orient === "land";
      var center = g.look.align === "center";
      var mark = Math.round(u * (land ? 15 : 17));
      var L = { mark: mark, center: center };
      var tw = land && !center ? Math.round(s.w * 0.62) : s.w;
      var tx = center ? s.x : s.x;
      var nameH = Math.round(u * (land ? 20 : 22));
      var top;
      if (land) top = Math.round(g.H / 2 - nameH * 0.55);
      else top = Math.round(s.y + s.h * (g.orient === "port" ? 0.62 : 0.56));
      L.name = g.text({ id: "brand", text: g.brand, role: "display", max: Math.round(u * (land ? 20 : 19)), box: { x: tx, y: top, w: tw, h: nameH }, align: center ? "center" : "left", valign: "bottom", lines: 2, at: 0.3 });
      L.line = g.text({ id: "outro", text: f[opts.line], role: "body", box: { x: tx, y: top + nameH + Math.round(u * 5), w: tw, h: Math.round(u * 15) }, align: center ? "center" : "left", lines: 2, at: 0.55 });
      if (land && !center) L.sup = { x: s.x + s.w * 0.96, y: g.H * 0.5, r: g.H * 0.9 };
      else if (land) L.sup = { x: g.W * 0.5, y: g.H * 0.5, r: g.H * 1.15 };
      else if (g.orient === "port") L.sup = { x: g.W * 0.5, y: s.y + s.h * 0.27, r: g.W * 0.86 };
      else L.sup = { x: g.W * 0.62, y: s.y + s.h * 0.2, r: g.W * 0.62 };
      L.markAt = center || !land ? { x: g.W / 2, y: top - mark * 0.85 } : { x: s.x + mark / 2, y: top - mark * 0.75 };
      if (!land && !center) L.markAt = { x: s.x + mark / 2, y: top - mark * 0.85 };
      return L;
    },
    draw: function (g, s, L) {
      var p = s.enter(0.05);
      drawSuper(g, L.sup.x, L.sup.y, L.sup.r, s.enter(0.0, { response: 1.1, damping: 0.9 }), s.e, s.drift(0.06, 0.1), L.center ? "rings" : null);
      drawMark(g, L.markAt.x, L.markAt.y, L.mark, p, s.e);
      var rx = L.center ? L.line.box.x + L.line.box.w / 2 - g.u * 6 : L.line.box.x;
      drawRule(g, L.center ? g.W / 2 - g.u * 6 : g.safe.x, L.name.box.y + L.name.box.h + g.u * 2.2, g.u * 12, s.enter(0.5), s.e);
      T(g, L.name, s);
      T(g, L.line, s);
    }
  };
}

// An abstract portrait: a ring, a disc and a person shape. No face, no photo.
function drawAvatar(g, cx, cy, size, p, e, s) {
  if (p <= 0 || e >= 1) return;
  var c = g.ctx, u = g.u;
  var r = size / 2;
  var disc = g.shapeInk(g.bg, [g.pal.main, g.pal.accent, g.pal.dark], 1.5);
  var fig = g.shapeInk(disc, [g.pal.light, g.pal.accent, g.pal.dark], 2.2);
  var ring = g.shapeInk(g.bg, [g.pal.accent, g.pal.main, g.pal.light], 1.6);
  c.save();
  c.globalAlpha = clamp(p * 2, 0, 1) * (1 - e);
  c.translate(cx, cy + e * u * 4);
  c.scale(0.8 + 0.2 * p, 0.8 + 0.2 * p);
  var st = g.look.card.style;
  var square = st === "outline" || st === "flat" || st === "tech";
  var shape = function (k) {
    c.beginPath();
    if (square) c.rect(-r * k, -r * k, r * k * 2, r * k * 2);
    else c.arc(0, 0, r * k, 0, TAU);
  };
  // Ring draws on around the portrait.
  c.strokeStyle = css(ring);
  c.lineWidth = Math.max(2, u * 0.6);
  if (square) {
    c.setLineDash([r * 8, r * 8]);
    c.lineDashOffset = r * 8 * (1 - clamp(p, 0, 1));
    shape(1.0);
    c.stroke();
    c.setLineDash([]);
  } else {
    c.beginPath();
    c.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(p, 0, 1));
    c.stroke();
  }
  shape(0.86);
  c.save();
  c.clip();
  c.fillStyle = css(disc);
  c.fillRect(-r, -r, size, size);
  c.fillStyle = css(fig);
  c.beginPath();
  c.arc(0, -r * 0.18, r * 0.3, 0, TAU);
  c.fill();
  c.beginPath();
  c.ellipse(0, r * 0.72, r * 0.6, r * 0.5, 0, 0, TAU);
  c.fill();
  c.restore();
  if (st === "hard" || st === "badge") {
    shape(0.86);
    c.lineWidth = Math.max(2, u * 0.42);
    c.strokeStyle = css(cmix(g.pal.dark, BLACK, 0.2));
    c.stroke();
  }
  c.restore();
}

/* mp4.js */
/*
 * A small MP4 muxer for 1 H.264 video track, in plain JS.
 * Input: encoded samples in decode order (length-prefixed NAL units) and the
 * avcC record. Output: ftyp, moov (with the sample tables) and mdat, with moov
 * first so players can start at once.
 */
function Bytes() {
  this.parts = [];
  this.size = 0;
}
Bytes.prototype.u8 = function (v) { this.parts.push(new Uint8Array([v & 255])); this.size += 1; return this; };
Bytes.prototype.u16 = function (v) { this.parts.push(new Uint8Array([(v >> 8) & 255, v & 255])); this.size += 2; return this; };
Bytes.prototype.u32 = function (v) {
  this.parts.push(new Uint8Array([(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255]));
  this.size += 4;
  return this;
};
Bytes.prototype.i32 = function (v) { return this.u32(v >>> 0); };
Bytes.prototype.str = function (s) {
  var a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255;
  this.parts.push(a);
  this.size += a.length;
  return this;
};
Bytes.prototype.bytes = function (a) { this.parts.push(a); this.size += a.length; return this; };
Bytes.prototype.zeros = function (n) { return this.bytes(new Uint8Array(n)); };
Bytes.prototype.done = function () {
  var out = new Uint8Array(this.size), o = 0;
  for (var i = 0; i < this.parts.length; i++) { out.set(this.parts[i], o); o += this.parts[i].length; }
  return out;
};

function box(type, fill) {
  var body = new Bytes();
  if (fill) fill(body);
  var data = body.done();
  var b = new Bytes();
  b.u32(data.length + 8).str(type).bytes(data);
  return b.done();
}

function fullbox(type, version, flags, fill) {
  return box(type, function (b) {
    b.u8(version).u8((flags >> 16) & 255).u16(flags & 65535);
    if (fill) fill(b);
  });
}

function boxes(type, children) {
  return box(type, function (b) { children.forEach(function (c) { if (c) b.bytes(c); }); });
}

var MATRIX = [0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000];

/*
 * o: { width, height, fps, avcC: Uint8Array, samples: [{ data, key, pts }] }
 * pts is the presentation frame index of each sample, samples are in decode order.
 */
function muxMp4(o) {
  var n = o.samples.length;
  var timescale = o.fps * 1000, delta = 1000;
  var mediaDur = n * delta;
  var movieDur = Math.round((n / o.fps) * 1000);
  // Frame reordering (B frames): composition offsets plus an edit list.
  var shift = 0, reorder = false;
  for (var i = 0; i < n; i++) {
    if (o.samples[i].pts !== i) reorder = true;
    shift = Math.max(shift, i - o.samples[i].pts);
  }
  function build(mdatOffset) {
    var ftyp = box("ftyp", function (b) { b.str("isom").u32(512).str("isom").str("iso2").str("avc1").str("mp41"); });
    var mvhd = fullbox("mvhd", 0, 0, function (b) {
      b.u32(0).u32(0).u32(1000).u32(movieDur).u32(0x00010000).u16(0x0100).zeros(10);
      MATRIX.forEach(function (m) { b.u32(m); });
      b.zeros(24).u32(2);
    });
    var tkhd = fullbox("tkhd", 0, 3, function (b) {
      b.u32(0).u32(0).u32(1).u32(0).u32(movieDur).zeros(8).u16(0).u16(0).u16(0).u16(0);
      MATRIX.forEach(function (m) { b.u32(m); });
      b.u32(o.width * 65536).u32(o.height * 65536);
    });
    var edts = reorder ? boxes("edts", [fullbox("elst", 0, 0, function (b) {
      b.u32(1).u32(movieDur).u32(shift * delta).u16(1).u16(0);
    })]) : null;
    var mdhd = fullbox("mdhd", 0, 0, function (b) { b.u32(0).u32(0).u32(timescale).u32(mediaDur).u16(0x55c4).u16(0); });
    var hdlr = fullbox("hdlr", 0, 0, function (b) { b.u32(0).str("vide").zeros(12).str("VideoHandler").u8(0); });
    var vmhd = fullbox("vmhd", 0, 1, function (b) { b.u16(0).u16(0).u16(0).u16(0); });
    var dinf = boxes("dinf", [fullbox("dref", 0, 0, function (b) { b.u32(1).bytes(fullbox("url ", 0, 1)); })]);
    var avc1 = box("avc1", function (b) {
      b.zeros(6).u16(1).u16(0).u16(0).zeros(12).u16(o.width).u16(o.height)
        .u32(0x00480000).u32(0x00480000).u32(0).u16(1);
      var name = "Useful Studio";
      b.u8(name.length).str(name).zeros(31 - name.length);
      b.u16(0x18).u16(0xffff);
      b.bytes(box("avcC", function (x) { x.bytes(o.avcC); }));
      b.bytes(box("pasp", function (x) { x.u32(1).u32(1); }));
    });
    var stsd = fullbox("stsd", 0, 0, function (b) { b.u32(1).bytes(avc1); });
    var stts = fullbox("stts", 0, 0, function (b) { b.u32(1).u32(n).u32(delta); });
    var ctts = reorder ? fullbox("ctts", 0, 0, function (b) {
      b.u32(n);
      for (var i = 0; i < n; i++) b.u32(1).u32((o.samples[i].pts - i + shift) * delta);
    }) : null;
    var keys = [];
    o.samples.forEach(function (s, i) { if (s.key) keys.push(i + 1); });
    var stss = fullbox("stss", 0, 0, function (b) { b.u32(keys.length); keys.forEach(function (k) { b.u32(k); }); });
    var stsc = fullbox("stsc", 0, 0, function (b) { b.u32(1).u32(1).u32(n).u32(1); });
    var stsz = fullbox("stsz", 0, 0, function (b) { b.u32(0).u32(n); o.samples.forEach(function (s) { b.u32(s.data.length); }); });
    var stco = fullbox("stco", 0, 0, function (b) { b.u32(1).u32(mdatOffset); });
    var stbl = boxes("stbl", [stsd, stts, ctts, stss, stsc, stsz, stco]);
    var minf = boxes("minf", [vmhd, dinf, stbl]);
    var mdia = boxes("mdia", [mdhd, hdlr, minf]);
    var trak = boxes("trak", [tkhd, edts, mdia]);
    var moov = boxes("moov", [mvhd, trak]);
    return { ftyp: ftyp, moov: moov };
  }
  var first = build(0);
  var payload = 0;
  o.samples.forEach(function (s) { payload += s.data.length; });
  var head = first.ftyp.length + first.moov.length;
  var fin = build(head + 8);
  var out = new Uint8Array(head + 8 + payload);
  out.set(fin.ftyp, 0);
  out.set(fin.moov, fin.ftyp.length);
  var o2 = head;
  var sz = payload + 8;
  out[o2] = (sz >>> 24) & 255; out[o2 + 1] = (sz >>> 16) & 255; out[o2 + 2] = (sz >>> 8) & 255; out[o2 + 3] = sz & 255;
  out[o2 + 4] = 0x6d; out[o2 + 5] = 0x64; out[o2 + 6] = 0x61; out[o2 + 7] = 0x74;
  var off = head + 8;
  o.samples.forEach(function (s) { out.set(s.data, off); off += s.data.length; });
  return out;
}

/*
 * Some encoders hand back Annex B (start codes) and no avcC. Turn that into
 * length-prefixed NAL units and build the avcC from the SPS and PPS.
 */
function splitAnnexB(d) {
  var units = [], i = 0, start = -1;
  while (i + 2 < d.length) {
    var sc = d[i] === 0 && d[i + 1] === 0 && (d[i + 2] === 1 || (d[i + 2] === 0 && i + 3 < d.length && d[i + 3] === 1));
    if (sc) {
      var len = d[i + 2] === 1 ? 3 : 4;
      if (start >= 0) units.push(d.subarray(start, i));
      i += len;
      start = i;
    } else i++;
  }
  if (start >= 0) units.push(d.subarray(start));
  return units.map(function (u) {
    var e = u.length;
    while (e > 0 && u[e - 1] === 0) e--;
    return u.subarray(0, e);
  }).filter(function (u) { return u.length; });
}

function looksAnnexB(d) {
  return d.length > 4 && d[0] === 0 && d[1] === 0 && (d[2] === 1 || (d[2] === 0 && d[3] === 1));
}

function toLengthPrefixed(units) {
  var size = 0;
  units.forEach(function (u) { size += u.length + 4; });
  var out = new Uint8Array(size), o = 0;
  units.forEach(function (u) {
    out[o] = (u.length >>> 24) & 255; out[o + 1] = (u.length >>> 16) & 255; out[o + 2] = (u.length >>> 8) & 255; out[o + 3] = u.length & 255;
    out.set(u, o + 4);
    o += u.length + 4;
  });
  return out;
}

function buildAvcC(sps, pps) {
  var b = new Bytes();
  b.u8(1).u8(sps[1]).u8(sps[2]).u8(sps[3]).u8(0xff).u8(0xe1).u16(sps.length).bytes(sps).u8(1).u16(pps.length).bytes(pps);
  return b.done();
}

/* export.js */
/*
 * Export: draw every frame at 30 fps at full size, encode with WebCodecs
 * (H.264) and mux with muxMp4. Video only. Works in chunks and waits on the
 * encoder queue, so the page stays responsive.
 */
var CODECS = ["avc1.640028", "avc1.4d0028", "avc1.420028", "avc1.42001f"];

function encoderConfig(codec, w, h, bitrate) {
  return {
    codec: codec,
    width: w,
    height: h,
    bitrate: bitrate,
    framerate: FPS,
    avc: { format: "avc" },
    latencyMode: "quality"
  };
}

function defaultBitrate(w, h) {
  return Math.round(w * h * FPS * 0.11);
}

// The first H.264 setup this browser can encode at this size, or null.
function findEncoder(w, h, bitrate) {
  if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") return Promise.resolve(null);
  var i = 0;
  function next() {
    if (i >= CODECS.length) return Promise.resolve(null);
    var cfg = encoderConfig(CODECS[i++], w, h, bitrate);
    return VideoEncoder.isConfigSupported(cfg).then(function (r) {
      return r && r.supported ? cfg : next();
    }, next);
  }
  return next();
}

function tick() {
  return new Promise(function (r) { setTimeout(r, 0); });
}

function exportFilm(film, opts) {
  opts = opts || {};
  var W = film.g.W, H = film.g.H;
  var bitrate = opts.bitrate || defaultBitrate(W, H);
  var onProgress = opts.onProgress || function () {};
  var cancelled = function () { return opts.cancel && opts.cancel(); };
  return findEncoder(W, H, bitrate).then(function (cfg) {
    if (!cfg) throw new Error("no-encoder");
    var canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d", { alpha: false });
    var samples = [];
    var desc = null;
    var failure = null;
    var enc = new VideoEncoder({
      output: function (chunk, meta) {
        if (meta && meta.decoderConfig && meta.decoderConfig.description && !desc) {
          var d = meta.decoderConfig.description;
          desc = d instanceof ArrayBuffer ? new Uint8Array(d.slice(0)) : new Uint8Array(d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength));
        }
        var data = new Uint8Array(chunk.byteLength);
        chunk.copyTo(data);
        samples.push({ data: data, key: chunk.type === "key", pts: Math.round((chunk.timestamp * FPS) / 1e6) });
      },
      error: function (e) { failure = e; }
    });
    enc.configure(cfg);
    var n = film.frames;
    var i = 0;
    function step() {
      if (failure) return Promise.reject(failure);
      if (cancelled()) { try { enc.close(); } catch (e) {} return Promise.reject(new Error("cancelled")); }
      if (i >= n) return enc.flush();
      var batchEnd = Math.min(n, i + 2);
      for (; i < batchEnd; i++) {
        renderFrame(ctx, film, i / FPS);
        var frame = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
        enc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
        frame.close();
      }
      onProgress(i / n);
      return waitQueue().then(step);
    }
    function waitQueue() {
      if (enc.encodeQueueSize <= 3) return tick();
      return tick().then(waitQueue);
    }
    return step().then(function () {
      enc.close();
      if (failure) throw failure;
      return finishMux(samples, desc, W, H);
    });
  });
}

function finishMux(samples, desc, W, H) {
  if (!samples.length) throw new Error("no-frames");
  var avcC = desc;
  if (!avcC || looksAnnexB(samples[0].data)) {
    var sps = null, pps = null;
    samples.forEach(function (s) {
      if (!looksAnnexB(s.data)) return;
      var units = splitAnnexB(s.data);
      units.forEach(function (u) {
        var type = u[0] & 31;
        if (type === 7 && !sps) sps = u;
        if (type === 8 && !pps) pps = u;
      });
      s.data = toLengthPrefixed(units.filter(function (u) { var t = u[0] & 31; return t !== 9; }));
    });
    if (!avcC) {
      if (!sps || !pps) throw new Error("no-avcc");
      avcC = buildAvcC(sps, pps);
    }
  }
  return muxMp4({ width: W, height: H, fps: FPS, avcC: avcC, samples: samples });
}

/* panel.js */
/*
 * The page: settings panel, player, clean view, export, and the debug hook
 * the tests use (window.__pack).
 */
var APP = { film: null, settings: null, playing: true, t: 0, anchor: 0, anchorT: 0, exporting: false, free: false, encoderOk: null };
var STORE_KEY = "";

function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (attrs[k] == null) return;
    if (k === "text") e.textContent = attrs[k];
    else if (k === "class") e.className = attrs[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);

  (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

function $(id) { return document.getElementById(id); }

// The look's 1-word name, as shown in the panel.
function lookName(id) {
  return id.charAt(0).toUpperCase() + id.slice(1);
}

// Settings <-> URL hash.
function toHash(s) {
  var q = new URLSearchParams();
  q.set("look", s.look);
  q.set("size", s.size);
  q.set("display", s.display);
  q.set("body", s.body);
  q.set("brand", s.brand);
  ["main", "accent", "dark", "light"].forEach(function (k) { q.set(k, s.colors[k].replace("#", "")); });
  Object.keys(s.fields).forEach(function (k) { q.set("f." + k, s.fields[k]); });
  return q.toString();
}

function fromHash(h) {
  h = String(h || "").replace(/^#/, "");
  if (!h) return null;
  var q = new URLSearchParams(h);
  if (!q.has("look")) return null;
  var s = { look: q.get("look"), size: q.get("size"), display: q.get("display"), body: q.get("body"), brand: q.get("brand"), colors: {}, fields: {} };
  ["main", "accent", "dark", "light"].forEach(function (k) { if (q.get(k)) s.colors[k] = "#" + q.get(k); });
  q.forEach(function (v, k) { if (k.slice(0, 2) === "f.") s.fields[k.slice(2)] = v; });
  return s;
}

function storeGet() {
  try {
    var v = window.localStorage.getItem(STORE_KEY);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

function storeSet(s) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}

function storeClear() {
  try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
}

function saveSettings() {
  var s = APP.settings;
  storeSet(s);
  var h = "#" + toHash(s);
  try { history.replaceState(null, "", h); } catch (e) {
    try { location.replace(h); } catch (e2) {}
  }
}

function fontSpecs(s) {
  var specs = [];
  var g = makeG(s);
  ["display", "title", "number", "body", "label"].forEach(function (r) {
    var ty = g.type(r);
    specs.push({ id: ty.font, weight: ty.weight });
  });
  return specs;
}

function clearTextCaches() {
  measureCache = {};
  metricCache = {};
  fitCache = {};
}

// Apply settings: load the fonts, then plan the film again.
function applySettings(s, quiet) {
  APP.settings = cleanSettings(TEMPLATE, s);
  return loadFonts(fontSpecs(APP.settings)).then(function () {
    clearTextCaches();
    var oldD = APP.film ? APP.film.D : 0;
    APP.film = planFilm(APP.settings, APP.free);
    var cv = $("film");
    if (cv.width !== APP.film.g.W || cv.height !== APP.film.g.H) {
      cv.width = APP.film.g.W;
      cv.height = APP.film.g.H;
      fitStage();
    }
    if (oldD && APP.t >= APP.film.D) APP.t = APP.t % APP.film.D;
    if (!quiet) saveSettings();
    syncPanel();
    checkEncoder();
    drawNow();
  });
}

function drawNow() {
  var cv = $("film");
  renderFrame(cv.getContext("2d"), APP.film, APP.t);
  var sc = $("scrub");
  if (sc) {
    sc.max = String(APP.film.frames - 1);
    sc.value = String(Math.floor(APP.t * FPS + 1e-6));
  }
  var tm = $("time");
  if (tm) tm.textContent = APP.t.toFixed(1) + " s of " + APP.film.D.toFixed(1) + " s";
  var sc = APP.film.scenes[sceneAt(APP.film, APP.t)];
  document.documentElement.style.setProperty("--film-bg", css(APP.film.g.tones[sc.tone] || APP.film.g.tones.base));
}

function loop(now) {
  if (APP.playing && !APP.exporting && APP.film) {
    if (APP.anchor === 0) { APP.anchor = now; APP.anchorT = APP.t; }
    var t = APP.anchorT + (now - APP.anchor) / 1000;
    APP.t = t % APP.film.D;
    drawNow();
  }
  requestAnimationFrame(loop);
}

function fitStage() {
  var cv = $("film");
  if (!cv || !APP.film) return;
  var clean = document.body.classList.contains("clean");
  var box = clean ? { w: window.innerWidth, h: window.innerHeight } : (function () {
    var f = $("frame");
    var cs = getComputedStyle(f);
    return {
      w: f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
      h: f.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
    };
  })();
  var k = Math.min(box.w / cv.width, box.h / cv.height);
  cv.style.width = Math.floor(cv.width * k) + "px";
  cv.style.height = Math.floor(cv.height * k) + "px";
}

function setClean(on) {
  document.body.classList.toggle("clean", on);
  fitStage();
  if (on) {
    var h = $("cleanhint");
    h.classList.add("show");
    setTimeout(function () { h.classList.remove("show"); }, 2500);
  }

function slug(s) {
  return String(s).trim().replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "video";
}

function fileName() {
  var g = APP.film.g;
  return slug(APP.settings.brand) + "-" + TEMPLATE.id + "-" + g.W + "x" + g.H + ".mp4";
}

function checkEncoder() {

  findEncoder(g.W, g.H, defaultBitrate(g.W, g.H)).then(function (cfg) {
    APP.encoderOk = !!cfg;
    $("export").hidden = !cfg;
    $("noexport").hidden = !!cfg;
  });
}

function runExport() {
  if (APP.exporting) return;
  APP.exporting = true;
  var btn = $("export"), bar = $("bar"), msg = $("exportmsg"), link = $("download"), stop = $("cancel");
  btn.disabled = true;
  link.hidden = true;
  stop.hidden = false;
  bar.hidden = false;
  bar.value = 0;
  msg.textContent = "Making your video. Keep this tab open.";
  var cancel = false;
  stop.onclick = function () { cancel = true; };
  var film = planFilm(APP.settings, APP.free);
  exportFilm(film, {
    onProgress: function (p) { bar.value = p; msg.textContent = "Making your video: " + Math.round(p * 100) + "%. Keep this tab open."; },
    cancel: function () { return cancel; }
  }).then(function (bytes) {
    var blob = new Blob([bytes], { type: "video/mp4" });
    if (APP.lastUrl) URL.revokeObjectURL(APP.lastUrl);
    APP.lastUrl = URL.createObjectURL(blob);
    link.href = APP.lastUrl;
    link.download = fileName();
    link.textContent = "Download " + fileName();
    link.hidden = false;
    msg.textContent = "Your video is ready. It is " + (bytes.length / 1048576).toFixed(1) + " MB.";
    link.click();
  }).catch(function (e) {
    msg.textContent = e && e.message === "cancelled" ? "Export stopped." : "Export did not work in this browser. Use Clean view and record your screen instead.";
  }).then(function () {
    APP.exporting = false;
    btn.disabled = false;
    stop.hidden = true;
    bar.hidden = true;
  });
}

// Debug and test hook. The page works without it.
function hashCanvas(cv) {
  var d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
  var h = 0x811c9dc5;
  for (var i = 0; i < d.length; i += 1) {
    h ^= d[i];
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}

function contrastReport(t) {
  var cv = document.createElement("canvas");
  cv.width = APP.film.g.W;
  cv.height = APP.film.g.H;
  var ctx = cv.getContext("2d");
  var log = renderFrame(ctx, APP.film, t, { noText: true });
  return log.filter(function (r) { return r.phase === "hold"; }).map(function (r) {
    var x = clamp(r.x, 0, cv.width - 1), y = clamp(r.y, 0, cv.height - 1);
    var w = clamp(r.w, 1, cv.width - x), h = clamp(r.h, 1, cv.height - y);
    var d = ctx.getImageData(x, y, w, h).data;
    var fg = hexRgb(r.fg);
    var ratios = [];
    var step = Math.max(1, Math.floor((w * h) / 4000));
    for (var i = 0; i < w * h; i += step) {
      ratios.push(contrast(fg, [d[i * 4], d[i * 4 + 1], d[i * 4 + 2]]));
    }
    ratios.sort(function (a, b) { return a - b; });
    return { id: r.id, text: r.text, need: r.ratio, min: ratios[0], p05: ratios[Math.floor(ratios.length * 0.05)], median: ratios[Math.floor(ratios.length / 2)] };
  });
}

function sheet(cells, o) {
  o = o || {};
  var cols = o.cols || 3, cw = o.cellW || 560, gap = o.gap || 16, pad = o.pad || 24, labelH = o.labels ? 34 : 0;
  var saved = JSON.parse(JSON.stringify(APP.settings));
  var rendered = [];
  var chain = Promise.resolve();
  cells.forEach(function (cell) {
    chain = chain.then(function () {
      var s = JSON.parse(JSON.stringify(saved));
      if (cell.settings) Object.keys(cell.settings).forEach(function (k) { s[k] = cell.settings[k]; });
      return applySettings(s, true).then(function () {
        var f = APP.film;
        var t = cell.t != null ? cell.t : f.D * (cell.at || 0);
        var cv = document.createElement("canvas");
        cv.width = f.g.W; cv.height = f.g.H;
        renderFrame(cv.getContext("2d"), f, t, { noGrain: !!o.noGrain });
        rendered.push({ cv: cv, label: cell.label || "" });
      });
    });
  });
  return chain.then(function () {
    var rows = Math.ceil(rendered.length / cols);
    var cellH = o.cellH || Math.round(cw * rendered[0].cv.height / rendered[0].cv.width);
    var W = pad * 2 + cols * cw + (cols - 1) * gap;
    var H = pad * 2 + rows * (cellH + labelH) + (rows - 1) * gap;
    var out = document.createElement("canvas");
    out.width = W; out.height = H;
    var c = out.getContext("2d");
    c.fillStyle = o.bg || "#17181d";
    c.fillRect(0, 0, W, H);
    c.imageSmoothingQuality = "high";
    rendered.forEach(function (r, i) {
      var x = pad + (i % cols) * (cw + gap), y = pad + Math.floor(i / cols) * (cellH + labelH + gap);
      var k = Math.min(cw / r.cv.width, cellH / r.cv.height);
      var w = Math.round(r.cv.width * k), h = Math.round(r.cv.height * k);
      c.drawImage(r.cv, x + Math.round((cw - w) / 2), y + Math.round((cellH - h) / 2), w, h);
      if (labelH) {
        c.fillStyle = "#c9ccd6";
        c.font = "500 18px Inter";
        c.textBaseline = "middle";
        c.fillText(r.label, x, y + cellH + labelH / 2 + 2);
      }
    });
    return applySettings(saved, true).then(function () { return out.toDataURL("image/png"); });
  });
}

function toBase64(bytes) {
  var s = "";
  for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function installHook(ready) {
  window.__pack = {
    ready: ready,
    id: TEMPLATE.id,
    name: TEMPLATE.name,
    free: APP.free,
    looks: TEMPLATE.looks.slice(),
    settings: function () { return JSON.parse(JSON.stringify(APP.settings)); },
    defaults: function () { return defaultSettings(TEMPLATE); },
    set: function (partial) {
      var s = JSON.parse(JSON.stringify(APP.settings));
      Object.keys(partial || {}).forEach(function (k) { s[k] = partial[k]; });
      if (partial && partial.look && !partial.display) { s.display = LOOKS[partial.look].display.font; s.body = LOOKS[partial.look].body.font; }
      return applySettings(s, true).then(function () { return APP.film.D; });
    },
    pause: function () { setPlaying(false); },
    duration: function () { return APP.film.D; },
    frames: function () { return APP.film.frames; },
    plan: function () {
      return APP.film.scenes.map(function (s) {
        return { start: s.start, out: s.out, dur: s.dur, tone: s.tone, texts: s.blocks.map(function (b) { return { id: b.id, text: b.text, words: b.words, at: b.at, land: b.land, size: b.size }; }) };
      });
    },
    draw: function (t, o) { return renderFrame($("film").getContext("2d"), APP.film, t, o); },
    texts: function (t) { return renderFrame($("film").getContext("2d"), APP.film, t); },
    // The same frame drawn into a 1 px canvas: the text log without the cost of painting.
    logs: function (t) { return renderFrame(noopCtx(), APP.film, t); },
    info: function () { var g = APP.film.g; return { W: g.W, H: g.H, minText: g.minText, D: APP.film.D, frames: APP.film.frames }; },
    hash: function (t) { renderFrame($("film").getContext("2d"), APP.film, t); return hashCanvas($("film")); },
    contrast: contrastReport,
    sheet: sheet,
    encoder: function () { var g = APP.film.g; return findEncoder(g.W, g.H, defaultBitrate(g.W, g.H)).then(function (c) { return c && c.codec; }); },
    exportBase64: function (o) {
      var film = planFilm(APP.settings, APP.free);
      return exportFilm(film, o || {}).then(toBase64);
    },
    fileName: fileName
  };
}

function boot(free) {
  APP.free = !!free;
  STORE_KEY = "useful-studio-pack:" + TEMPLATE.id + (free ? ":free" : "");
  document.title = TEMPLATE.name + " | Useful Studio";
  buildPanel();
  var initial = fromHash(location.hash) || storeGet() || defaultSettings(TEMPLATE);
  var ready = applySettings(initial, true).then(function () {
    fitStage();
    requestAnimationFrame(loop);
    return true;
  });
  installHook(ready);
  window.addEventListener("hashchange", function () {
    var s = fromHash(location.hash);
    if (s && toHash(cleanSettings(TEMPLATE, s)) !== toHash(APP.settings)) applySettings(s, true);
  });
}

        return {

          title: g.text({ id: "intro", text: f.intro, role: "display", box: { x: a.x, y: a.y + Math.round(a.h * (land ? 0.18 : 0.12)), w: a.w, h: Math.round(a.h * (land ? 0.64 : 0.8)) }, valign: land ? "middle" : "bottom", lines: 4, at: 0.25 })
        };
      },
      draw: function (g, s, L) {
        var c = g.ctx, b = L.bars, u = g.u;
        var vals = [0.32, 0.46, 0.4, 0.62, 0.74, 0.92];
        var n = vals.length;
        var gap = Math.round(u * 1.6);
        var bw = Math.floor((b.w - gap * (n - 1)) / n);
        var base = b.y + b.h;
        var col = g.shapeInk(g.bg, [g.pal.main, g.pal.dark, g.pal.accent], 1.6);
        var hi = g.shapeInk(g.bg, [g.pal.accent, g.pal.main], 1.4);
        for (var i = 0; i < n; i++) {
          var p = s.enter(0.35 + i * 0.07);
          var h = Math.round(b.h * vals[i] * p * (1 - s.e * 0.9));
          var x = b.x + i * (bw + gap);
          c.fillStyle = css(i === n - 1 ? hi : col);
          if (g.look.card.style === "neon") {
            glowLine(g, x + bw / 2, base, x + bw / 2, base - h, i === n - 1 ? g.pal.accent : g.pal.main, 1, bw * 0.16);
          } else if (g.look.card.style === "calm") {
            roundRect(c, x, base - h, bw, h, Math.min(bw / 2, h / 2));
            c.fill();
          } else {
            c.fillRect(x, base - h, bw, h);
          }
        }
        // Baseline.
        c.fillStyle = css(g.shapeInk(g.bg, [g.pal.dark, g.pal.light], 3), 0.6);
        c.fillRect(b.x, base, Math.round(b.w * s.enter(0.25) * (1 - s.e)), Math.max(2, Math.round(u * 0.25)));
        T(g, L.title, s);
      }
    },
    {
      tone: "alt",
      min: 3.6,
      layout: function (g, f) {
        var s = g.safe, u = g.u;
        var land = g.orient === "land";
        var sp = g.split(land ? 0.56 : 0.46, 4);
        var a = sp.a;
        var srcH = Math.round(u * 6);
        var L = {};
        if (land) {
          L.stat = g.text({ id: "stat", text: f.stat, role: "number", box: { x: a.x, y: a.y, w: a.w, h: Math.round(a.h * 0.5) }, valign: "bottom", lines: 1, at: 0.25 });
          L.label = g.text({ id: "label", text: f.label, role: "title", box: { x: a.x, y: a.y + Math.round(a.h * 0.56), w: a.w, h: Math.round(a.h * 0.3) }, lines: 3, at: 0.6 });
          L.ring = { x: sp.b.x + sp.b.w / 2, y: sp.b.y + sp.b.h / 2, r: Math.min(sp.b.w, sp.b.h) * 0.36 };
        } else {
          L.stat = g.text({ id: "stat", text: f.stat, role: "number", box: { x: a.x, y: a.y, w: a.w, h: Math.round(a.h * 0.58) }, valign: "bottom", lines: 1, at: 0.25 });
          L.label = g.text({ id: "label", text: f.label, role: "title", box: { x: a.x, y: a.y + Math.round(a.h * 0.64), w: a.w, h: Math.round(a.h * 0.36) }, lines: 3, at: 0.6 });
          var bb = sp.b;
          var rr = Math.min(bb.w, bb.h - srcH - u * 6) * 0.38;
          L.ring = { x: bb.x + bb.w / 2, y: bb.y + (bb.h - srcH - u * 4) / 2, r: rr };
        }
        L.source = g.text({ id: "source", text: f.source, role: "label", box: { x: s.x, y: s.y + s.h - srcH, w: land ? a.w : s.w, h: srcH }, valign: "bottom", lines: 1, at: 0.8, upper: false, track: 0.01 });
        var v = numberIn(f.stat);
        L.frac = /%/.test(f.stat) && v > 0 ? clamp(v / 100, 0.02, 1) : 0.78;
        return L;
      },
      draw: function (g, s, L) {
        var R = L.ring;
        var p = s.enter(0.25, L.stat.spring);
        var c = g.ctx;
        c.save();
        c.globalAlpha = 1 - s.e;
        drawRing(g, R.x, R.y, R.r, L.frac * clamp(p, 0, 1.02), { width: g.u * (g.look.card.style === "flat" ? 3.4 : 2.4) });
        var ip = s.enter(0.9);
        var col = g.shapeInk(g.bg, [g.pal.main, g.pal.accent, g.pal.dark, g.pal.light], 2);
        drawIcon(g, "trend", R.x, R.y, R.r * 0.62, col, ip);
        c.restore();
        T(g, L.stat, s);
        T(g, L.label, s);
        T(g, L.source, s);
      }
    },
    outroScene({ line: "outro", tone: "pop" })
  ]
});

boot(true);
})();
